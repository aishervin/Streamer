name: SHEN SMS Live Overlay

concurrency:
  group: shen-sms-live-overlay
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Where should the live overlay stream?"
        required: true
        type: choice
        options:
          - channel
          - group
        default: channel

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-color-emoji fontconfig
          sudo fc-cache -f -v
          python -m pip install --quiet --upgrade pip pillow

      - name: Verify font paths
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf && echo "DejaVu OK" || echo "DejaVu MISSING"
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf && echo "DejaVu Bold OK" || echo "DejaVu Bold MISSING"
          test -f /usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf && echo "Liberation OK" || echo "Liberation MISSING"
          test -f /usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf && echo "Liberation Bold OK" || echo "Liberation Bold MISSING"

      - name: Prepare audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p music
          git clone --depth 1 https://github.com/aishervin/Mp3.git music_repo
          find music_repo -type f \( -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.aac' \) -exec cp -n {} music/ \;
          echo "Audio tracks prepared: $(find music -maxdepth 1 -type f | wc -l)"

      - name: Resolve Telegram destination
        id: destination
        shell: bash
        env:
          DESTINATION: ${{ inputs.destination }}
          CHANNEL_URL: ${{ secrets.CSTREAM_RTMPS_URL }}
          GROUP_URL: ${{ secrets.GSTREAM_RTMPS_URL || secrets.STREAM_RTMPS_URL }}
        run: |
          set -euo pipefail
          case "$DESTINATION" in
            channel) STREAM_URL="$CHANNEL_URL"; SECRET_NAME="CSTREAM_RTMPS_URL" ;;
            group) STREAM_URL="$GROUP_URL"; SECRET_NAME="GSTREAM_RTMPS_URL (or STREAM_RTMPS_URL)" ;;
            *) echo "::error::Choose channel or group."; exit 1 ;;
          esac
          if [[ -z "${STREAM_URL:-}" ]]; then
            echo "::error::Missing Actions secret $SECRET_NAME."
            exit 1
          fi
          echo "::add-mask::$STREAM_URL"
          echo "stream_url=$STREAM_URL" >> "$GITHUB_OUTPUT"
          echo "Destination selected: $DESTINATION"

      - name: Validate overlay script and live SMS fetch
        run: |
          python -m py_compile scripts/live_sms_overlay.py
          python -u scripts/live_sms_overlay.py --check-only --url "https://onlinesim.io/free_numbers/united-kingdom"

      - name: Stream four-country SMS overlay for four hours
        shell: bash
        env:
          STREAM_URL: ${{ steps.destination.outputs.stream_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STREAM_URL"
          python -u scripts/live_sms_overlay.py --rtmp-url "$STREAM_URL" --audio-dir music --duration-seconds 14400 \
            --url "https://onlinesim.io/free_numbers/united-kingdom"

      - name: Rest for thirty minutes
        if: success()
        run: |
          echo "Four-hour stream finished. Resting for 30 minutes."
          sleep 1800

      - name: Queue the next cycle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          DESTINATION: ${{ inputs.destination }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/stream-sms-live.yml/dispatches" \
            -d "{\"ref\":\"$REF_NAME\",\"inputs\":{\"destination\":\"$DESTINATION\"}}"
          echo "Next four-hour cycle queued."
